services:
  - type: web
    name: gym-slot-booking
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci
    startCommand: 'npx prisma db init --db "$DATABASE_URL" && npm run bootstrap:demo && npm start'
    healthCheckPath: /health/db
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gym-slot-booking-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: gym-slot-booking-db
    databaseName: gym_slot_booking
    user: gym_slot_booking
    plan: free
    region: singapore
